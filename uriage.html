<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="売上入力">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>売上入力</title>
<style>
  :root{
    --card:#ffffff; --text:#1a1f3a; --muted:#8a93b8; --line:#e3e7f3; --accent:#1b2545;
    --send:#16a34a; --danger:#ef4444;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
        background:#eef1f8; color:var(--text); padding:14px 14px 110px; }
  .topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .topbar h1{ font-size:22px; margin:0; }
  .clock{ text-align:right; } .clock .d{ font-size:13px; color:#5b639a; } .clock .t{ font-size:24px; font-weight:800; }
  .datebar{ background:var(--accent); color:#fff; border-radius:12px; padding:12px;
        text-align:center; font-weight:700; font-size:17px; margin-bottom:6px; display:flex;
        align-items:center; justify-content:center; gap:8px; }
  .datebar input{ background:transparent; border:none; color:#fff; font-size:17px; font-weight:700; }
  .dnote{ text-align:center; font-size:12px; color:#5b639a; margin-bottom:10px; }
  .dnote.warn{ color:var(--danger); font-weight:700; }
  .nav{ display:flex; gap:8px; margin-bottom:12px; }
  .navbtn{ flex:1; border:none; border-radius:12px; padding:12px 6px; font-weight:800; font-size:15px; }
  .navbtn.now{ background:var(--accent); color:#fff; }
  .daterow{ display:flex; gap:8px; align-items:stretch; margin-bottom:6px; }
  .daterow .datebar{ flex:1; margin-bottom:0; }
  .daterow .navbtn.now{ flex:0 0 76px; margin:0; }
  .wxpair{ display:flex; gap:12px; padding:6px 2px; }
  .wxcell{ flex:1; display:flex; align-items:center; gap:8px; min-width:0; }
  .wxcell .wxlbl{ font-weight:700; font-size:15px; white-space:nowrap; }
  .wxcell input{ flex:1; min-width:0; border:1px solid var(--line); border-radius:10px; padding:10px; font-size:16px; text-align:right; }
  .memorow{ display:flex; align-items:center; gap:10px; margin-top:8px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 12px; }
  .memorow .memolbl{ font-weight:700; font-size:15px; white-space:nowrap; }
  .memorow input{ flex:1; min-width:0; border:1px solid var(--line); border-radius:10px; padding:10px; font-size:16px; }
  .fields{ background:var(--card); border:1px solid var(--line); border-radius:14px;
        padding:6px 12px; box-shadow:0 1px 3px rgba(20,30,80,.05); }
  .frow{ display:flex; align-items:center; gap:10px; padding:8px 2px; border-bottom:1px solid var(--line); }
  .frow:last-child{ border-bottom:none; }
  .frow .lbl{ flex:0 0 132px; font-weight:700; font-size:16px; }
  .frow input{ flex:1; border:1px solid var(--line); border-radius:10px; padding:12px;
        font-size:18px; text-align:right; -moz-appearance:textfield; }
  .frow input::-webkit-outer-spin-button,.frow input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .total{ display:flex; justify-content:space-between; align-items:center; margin:12px 2px 4px;
        font-weight:800; font-size:17px; }
  .total .amt{ font-size:22px; color:var(--send); }
  .sec-head{ display:flex; justify-content:space-between; align-items:center; margin:16px 2px 8px; }
  .sec-head .lbl{ color:#5b639a; font-weight:700; }
  .list{ background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .lrow{ display:flex; align-items:center; gap:12px; padding:13px 14px; border-bottom:1px solid var(--line); }
  .lrow:last-child{ border-bottom:none; }
  .lrow.today{ background:#eef4ff; }
  .lrow .wd{ flex:1; font-weight:700; font-size:15px; }
  .lrow .wsub{ color:var(--muted); font-size:12px; font-weight:400; margin-left:6px; }
  .lrow .amt{ font-weight:800; font-size:15px; color:#334155; }
  .lrow .sentbadge{ font-size:12px; font-weight:800; color:#1d4ed8; background:#dbeafe; padding:5px 10px; border-radius:20px; white-space:nowrap; }
  .lrow .wdel{ border:none; background:none; color:var(--muted); font-size:17px; padding:4px 6px; }
  .lempty{ padding:16px; text-align:center; color:var(--muted); }
  .footbar{ position:fixed; left:0; right:0; bottom:0; padding:10px 14px;
        padding-bottom:calc(10px + env(safe-area-inset-bottom));
        background:#eef1f8; box-shadow:0 -2px 12px rgba(20,30,80,.10); z-index:50; display:flex; gap:8px; }
  .bigbtn{ flex:1; border:none; border-radius:14px; padding:16px; font-size:17px; font-weight:800; color:#fff; }
  .bigbtn.save{ background:var(--accent); } .bigbtn.send{ background:var(--send); }
  .hint{ text-align:center; color:#7c84ad; font-size:12px; margin-top:8px; }
  /* 画面内モーダル */
  .modal-bg{ position:fixed; inset:0; background:rgba(15,18,38,.55); display:none;
        align-items:center; justify-content:center; z-index:999; padding:24px; }
  .modal{ background:#fff; border-radius:16px; padding:20px; width:100%; max-width:340px;
        box-shadow:0 12px 40px rgba(0,0,0,.3); }
  .modal .m-msg{ font-size:16px; font-weight:700; margin-bottom:14px; line-height:1.5; }
  .modal input{ width:100%; font-size:18px; padding:12px; border:1px solid var(--line);
        border-radius:10px; margin-bottom:14px; }
  .m-btns{ display:flex; gap:10px; }
  .m-btns button{ flex:1; border:none; border-radius:10px; padding:13px; font-size:16px; font-weight:800; }
  .m-btns .m-ok{ background:var(--accent); color:#fff; } .m-btns .m-cancel{ background:#e2e8f0; color:#334155; }
</style>
</head>
<body>
  <div class="modal-bg" id="modal">
    <div class="modal">
      <div class="m-msg" id="m-msg"></div>
      <input id="m-input" style="display:none;">
      <div class="m-btns" id="m-btns"></div>
    </div>
  </div>

  <div class="topbar">
    <h1>💰 売上入力</h1>
    <div class="clock"><div class="d" id="cd"></div><div class="t" id="ct"></div></div>
  </div>

  <div class="daterow">
    <div class="datebar" onclick="openPicker()">📅 <input type="date" id="wd" min="2025-12-01" max="2026-04-30" onchange="manualDate()"></div>
    <button class="navbtn now" onclick="goToday()">今日</button>
  </div>
  <div class="dnote" id="dnote"></div>

  <div class="fields" id="wxfields"></div>

  <div class="fields" id="fields"></div>

  <div class="memorow"><span class="memolbl">メモ</span><input id="f_メモ" type="text" placeholder="メモ（任意）"></div>

  <div class="total"><span>当日売上（現金＋尾瀬＋paypay＋クレカ）</span><span class="amt" id="total">¥0</span></div>

  <div class="sec-head"><span class="lbl">入力済みの日</span></div>
  <div class="list" id="list"></div>

  <div class="footbar">
    <button class="bigbtn save" onclick="saveDay()">この日を保存</button>
    <button class="bigbtn send" onclick="sendCSV()">送信 ▶</button>
  </div>
  <p class="hint">「送信」を押すと共有が開く → 「"ファイル"に保存」→ OneDrive →「売上」。PCで「CSV取込」ボタンを押すと売上帳に反映されます。</p>

<script>
const DK="uriage_days_v1", SK="uriage_sent_v1", WKEY="uriage_workdate_v1";
const $=id=>document.getElementById(id);
// 内部キー(左)は売上帳の列ラベルに一致。表示名(右)はユーザーの馴染む略称。
const ITEMS=[
  ["現金","現金"],
  ["尾瀬だっペイ","尾瀬だっペイ"],
  ["paypay","paypay"],
  ["クレジットカード","クレカ"],
  ["自販機","自販機"],
  ["チューンナップ","チューンナップ"],
  ["レンタル","レンタル"],
];
// 当日売上に含む4項目(売上帳のL列 =E+F+G+H と一致)
const TODAY_KEYS=["現金","尾瀬だっペイ","paypay","クレジットカード"];
const SEASON_MIN="2025-12-01", SEASON_MAX="2026-04-30";
const WD="日月火水木金土";

const load=(k,d)=>{ try{return JSON.parse(localStorage.getItem(k))??d;}catch(e){return d;} };
const set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const days=()=>load(DK,{});         // { "2026-04-08": {現金:1000, ...}, ... }
const pad=n=>String(n).padStart(2,"0");
const ymd=dt=>`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
const today=()=>ymd(new Date());
const fmtD=s=>{ const[y,m,d]=s.split("-"); return `${parseInt(m)}/${parseInt(d)}`; };
const wdOf=s=>WD[new Date(s+"T00:00").getDay()];
const slash=s=>s.replace(/-/g,"/");   // 2026-04-08 -> 2026/04/08 (CSV/売上帳の形式)
const yen=n=>"¥"+Math.round(n||0).toLocaleString();
const inSeason=s=> s>=SEASON_MIN && s<=SEASON_MAX;

// ── 片品村の天気取得(Open-Meteo, APIキー不要) ──
const LAT=36.7876, LON=139.2264;   // 群馬県片品村
function wxText(c){
  if(c===0||c===1) return "晴れ";
  if(c===2) return "晴れ時々曇り";
  if(c===3) return "曇り";
  if(c===45||c===48) return "霧";
  if(c>=51&&c<=57) return "霧雨";
  if((c>=61&&c<=67)||(c>=80&&c<=82)) return "雨";
  if((c>=71&&c<=77)||c===85||c===86) return "雪";
  if(c>=95) return "雷雨";
  return "";
}
function fetchWeather(dateStr){
  const wxEl=$("f_天気"), tpEl=$("f_温度");
  if(!wxEl||!tpEl) return;
  wxEl.placeholder="取得中…";
  const daysAgo=(new Date(today()+"T00:00")-new Date(dateStr+"T00:00"))/86400000;
  const base=daysAgo>5 ? "https://archive-api.open-meteo.com/v1/archive"
                       : "https://api.open-meteo.com/v1/forecast";
  const url=`${base}?latitude=${LAT}&longitude=${LON}&start_date=${dateStr}&end_date=${dateStr}`
           +`&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo`;
  fetch(url).then(r=>r.json()).then(j=>{
    const d=j&&j.daily; if(!d){ wxEl.placeholder="天気(取得できず)"; return; }
    if(workDate()!==dateStr) return;   // 別の日に切り替わっていたら反映しない
    const code=d.weathercode?d.weathercode[0]:null;
    const tmax=d.temperature_2m_max?d.temperature_2m_max[0]:null;
    const tmin=d.temperature_2m_min?d.temperature_2m_min[0]:null;
    if(wxEl.value.trim()==="" && code!=null){ wxEl.value=wxText(code); }
    if(tpEl.value.trim()==="" && tmax!=null){
      tpEl.value = Math.round(tmax) + (tmin!=null ? "/"+Math.round(tmin) : "");
    }
    wxEl.placeholder="天気";
  }).catch(()=>{ wxEl.placeholder="天気(取得できず)"; });
}
// このデバイスに未保存の日を、PC受け取り役(/lookup)経由でOneDriveのCSVから探して反映
function fetchFromPC(dateStr){
  fetch(`/lookup?date=${dateStr}`).then(r=>r.json()).then(j=>{
    if(!j||!j.ok||!j.found) return;
    if(workDate()!==dateStr) return;        // 別の日に切り替わっていたら反映しない
    if(Object.keys(days()[dateStr]||{}).length>0) return;   // その間に保存/編集されていたら上書きしない
    const d=j.data||{};
    const all=days(); all[dateStr]=d; set(DK,all);
    render();
  }).catch(()=>{});
}
function beep(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext; const a=new AC();
    const o=a.createOscillator(), g=a.createGain();
    o.connect(g); g.connect(a.destination);
    o.type="square"; o.frequency.value=2500;
    g.gain.setValueAtTime(0.2,a.currentTime);
    o.start(); o.stop(a.currentTime+0.09);
    setTimeout(()=>{ try{a.close();}catch(e){} },200);
  }catch(e){}
}

// ── 画面内モーダル ──
function closeModal(){ $("modal").style.display="none"; $("m-input").style.display="none"; $("m-btns").innerHTML=""; }
function uiAlert(msg, cb){
  $("m-msg").textContent=msg; $("m-input").style.display="none";
  $("m-btns").innerHTML='<button class="m-ok">OK</button>'; $("modal").style.display="flex";
  $("m-btns").querySelector(".m-ok").onclick=()=>{ closeModal(); cb&&cb(); };
}
function uiConfirm(msg, onYes){
  $("m-msg").textContent=msg; $("m-input").style.display="none";
  $("m-btns").innerHTML='<button class="m-cancel">いいえ</button><button class="m-ok">はい</button>';
  $("modal").style.display="flex";
  $("m-btns").querySelector(".m-ok").onclick=()=>{ closeModal(); onYes&&onYes(); };
  $("m-btns").querySelector(".m-cancel").onclick=closeModal;
}

// ── 作業日 ──
function workDate(){
  let w=load(WKEY,null);
  if(!w||!inSeason(w)){ w=inSeason(today())?today():SEASON_MAX; set(WKEY,w); }
  return w;
}
function setWork(w){ set(WKEY,w); $("wd").value=w; }
function manualDate(){
  const w=$("wd").value;
  if(!inSeason(w)){ uiAlert("シーズン(2025/12/01〜2026/04/30)の日付を入れてください"); $("wd").value=workDate(); return; }
  setWork(w); render();
}
function goToday(){ const t=today(); if(!inSeason(t)){ uiAlert("今日はシーズン外です。日付を選んでください"); return; } setWork(t); render(); }
function openPicker(){ const el=$("wd"); if(el.showPicker){ try{ el.showPicker(); return; }catch(e){} } el.focus(); el.click(); }

// 送信済管理(編集したら解除)
const isSent=d=>load(SK,[]).includes(d);
function markAllSent(){ set(SK, Object.keys(days())); }
function clearSent(d){ set(SK, load(SK,[]).filter(x=>x!==d)); }

function curVals(){
  const o={};
  ITEMS.forEach(([k])=>{ const v=$("f_"+k).value.trim(); o[k]=v===""?0:Number(v); });
  const wxEl=$("f_天気"), tpEl=$("f_温度");
  o.天気 = wxEl ? wxEl.value.trim() : "";
  o.温度 = tpEl ? tpEl.value.trim() : "";
  const meEl=$("f_メモ"); o.メモ = meEl ? meEl.value.trim() : "";
  return o;
}
function recalc(){
  const o=curVals();
  let t=0; TODAY_KEYS.forEach(k=>{ t+=Number(o[k])||0; });
  $("total").textContent=yen(t);
}
function saveDay(){
  const w=workDate();
  if(!inSeason(w)){ uiAlert("シーズン外の日付です"); return; }
  const o=curVals();
  for(const [k] of ITEMS){ if(isNaN(o[k])){ uiAlert("数値を入れてください（"+k+"）"); return; } }
  const all=days(); all[w]=o; set(DK,all);
  clearSent(w);
  uiAlert(fmtD(w)+" を保存しました");
  render();
}
function loadDay(d){ setWork(d); render(); }
function delDay(ev,d){ ev.stopPropagation(); uiConfirm(fmtD(d)+" の入力を削除しますか？", ()=>{ const a=days(); delete a[d]; set(DK,a); clearSent(d); render(); }); }

function render(){
  const w=workDate(); $("wd").value=w;
  const note=$("dnote");
  if(!inSeason(w)){ note.className="dnote warn"; note.textContent="⚠ シーズン外の日付です"; }
  else{ note.className="dnote"; note.textContent=`${fmtD(w)}（${wdOf(w)}）を入力中`; }

  // 入力欄(この日の保存済み値を反映)
  const cur=days()[w]||{};
  const wxV=(cur.天気!=null)?String(cur.天気).replace(/"/g,"&quot;"):"";
  const tpV=(cur.温度!=null&&cur.温度!=="")?cur.温度:"";
  $("wxfields").innerHTML=
    `<div class="wxpair">`+
      `<div class="wxcell"><span class="wxlbl">天気</span><input id="f_天気" type="text" value="${wxV}" placeholder="天気"></div>`+
      `<div class="wxcell"><span class="wxlbl">気温</span><input id="f_温度" type="text" value="${tpV}" placeholder="—"></div>`+
    `</div>`;
  if($("f_メモ")) $("f_メモ").value=(cur.メモ!=null)?cur.メモ:"";
  $("fields").innerHTML=ITEMS.map(([k,label])=>{
    const v=(cur[k]!=null)?cur[k]:"";
    return `<div class="frow"><span class="lbl">${label}</span>
      <input id="f_${k}" type="number" inputmode="numeric" value="${v}" placeholder="0" oninput="recalc()"></div>`;
  }).join("");
  recalc();
  // 天気・気温が未入力なら、その売上日の天気を自動取得
  if((cur.天気==null||cur.天気==="") && (cur.温度==null||cur.温度==="")){ fetchWeather(w); }
  // このデバイスに保存が無い日は、PC(OneDrive)に既に送信済みのデータが無いか探して反映
  if(Object.keys(cur).length===0){ fetchFromPC(w); }

  // 入力済みの日一覧(日付降順)
  const all=days();
  const keys=Object.keys(all).sort().reverse();
  if(keys.length===0){
    $("list").innerHTML='<div class="lempty">まだ保存された日はありません</div>';
  }else{
    $("list").innerHTML=keys.map(d=>{
      let t=0; TODAY_KEYS.forEach(k=>{ t+=Number(all[d][k])||0; });
      return `<div class="lrow ${d===w?'today':''}" onclick="loadDay('${d}')">
        <span class="wd">${fmtD(d)}<span class="wsub">（${wdOf(d)}）</span></span>
        <span class="amt">${yen(t)}</span>
        ${isSent(d)?'<span class="sentbadge">✓送信済</span>':''}
        <button class="wdel" onclick="delDay(event,'${d}')">🗑</button>
      </div>`;
    }).join("");
  }
}

function buildCSV(){
  const all=days();
  const keys=Object.keys(all).sort();
  let csv="日付,天気,温度,現金,尾瀬だっペイ,paypay,クレジットカード,自販機,チューンナップ,レンタル,メモ\n";
  keys.forEach(d=>{
    const o=all[d];
    const wx=(o.天気!=null)?String(o.天気).replace(/,/g,"").replace(/[\r\n]/g,""):"";
    const tp=(o.温度!=null)?String(o.温度).replace(/,/g,"").replace(/[\r\n]/g,""):"";
    const me=(o.メモ!=null)?String(o.メモ).replace(/,/g,"，").replace(/[\r\n]/g," "):"";
    const row=[slash(d),wx,tp].concat(ITEMS.map(([k])=>Number(o[k])||0)).concat([me]);
    csv+=row.join(",")+"\n";
  });
  return csv;
}
function sendCSV(){
  beep();
  const all=days();
  if(Object.keys(all).length===0){ uiAlert("送信するデータがありません。先に保存してください"); return; }
  const csv=buildCSV();
  const stamp=new Date();
  const fname=`uriage_${stamp.getFullYear()}${pad(stamp.getMonth()+1)}${pad(stamp.getDate())}_${pad(stamp.getHours())}${pad(stamp.getMinutes())}${pad(stamp.getSeconds())}.csv`;
  const bom="﻿";
  const blob=new Blob([bom+csv],{type:"text/csv;charset=utf-8"});
  const file=new File([blob],fname,{type:"text/csv"});
  const done=()=>{ markAllSent(); render(); };
  if(location.protocol==="http:"){
    fetch("/save",{method:"POST",headers:{"Content-Type":"text/csv;charset=utf-8"},body:bom+csv})
      .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(()=>{ done(); uiAlert("PCに送信しました"); })
      .catch(e=>{ uiAlert("PCに送れませんでした。PCが起動しているか確認してください。\n"+e.message); });
    return;
  }
  if(navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:fname}).then(done).catch(()=>{});
  }else{
    const url=URL.createObjectURL(blob); const a=document.createElement("a");
    a.href=url; a.download=fname; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);
    done();
  }
}

function tick(){ const n=new Date();
  $("ct").textContent=`${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
  $("cd").textContent=`${fmtD(today())}（${wdOf(today())}）`;
}
render(); tick(); setInterval(tick,1000);
</script>
</body>
</html>
