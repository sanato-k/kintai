<meta name="apple-mobile-web-app-title" content="出勤簿">
<title>出勤簿</title>
<style>
  :root{
    --card:#ffffff; --text:#1a1f3a; --muted:#8a93b8; --line:#e3e7f3; --accent:#1b2545;
    --in:#86efac; --in-on:#15803d; --out:#f9a8d4; --out-on:#db2777;
    --early:#60a5fa; --early-on:#1d4ed8; --over:#fbbf24; --over-on:#b45309;
    --send:#16a34a; --danger:#ef4444; --ok:#16a34a;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
        background:#eef1f8; color:var(--text); padding:14px 14px 96px; }
  .topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .topbar h1{ font-size:22px; margin:0; }
  .clock{ text-align:right; } .clock .d{ font-size:13px; color:#5b639a; } .clock .t{ font-size:24px; font-weight:800; }
  .topright{ display:flex; align-items:center; gap:12px; }
  .power{ display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; }
  .plabel{ font-size:11px; font-weight:800; color:#15803d; }
  .power.off .plabel{ color:#94a3b8; }
  .switch{ width:48px; height:27px; border-radius:14px; background:#22c55e; position:relative; transition:background .2s; }
  .power.off .switch{ background:#cbd5e1; }
  .switch::after{ content:""; position:absolute; top:3px; left:24px; width:21px; height:21px;
        border-radius:50%; background:#fff; transition:left .2s; box-shadow:0 1px 3px rgba(0,0,0,.3); }
  .power.off .switch::after{ left:3px; }
  .datebar{ background:var(--accent); color:#fff; border-radius:12px; padding:12px;
        text-align:center; font-weight:700; font-size:17px; margin-bottom:6px; display:flex;
        align-items:center; justify-content:center; gap:8px; }
  .datebar input{ background:transparent; border:none; color:#fff; font-size:17px; font-weight:700; }
  .dnote{ text-align:center; font-size:12px; color:#5b639a; margin-bottom:8px; }
  .dnote.behind{ color:var(--danger); font-weight:700; }
  .nav{ display:flex; gap:8px; margin-bottom:12px; }
  .navbtn{ flex:1; border:none; border-radius:12px; padding:12px 6px; font-weight:800; font-size:15px; line-height:1.2; }
  .navbtn .sub{ display:block; font-size:10px; font-weight:600; opacity:.8; }
  .navbtn.back{ background:#e2e8f0; color:#334155; flex:1; }
  .navbtn.next{ background:var(--send); color:#fff; }
  .navbtn.now{ background:var(--accent); color:#fff; flex:0 0 64px; }
  .footbar{ position:fixed; left:0; right:0; bottom:0; padding:10px 14px;
        padding-bottom:calc(10px + env(safe-area-inset-bottom));
        background:#eef1f8; box-shadow:0 -2px 12px rgba(20,30,80,.10); z-index:50; }
  .footbar .navbtn{ width:100%; }
  .sec-head{ display:flex; justify-content:space-between; align-items:center; margin:10px 2px 8px; }
  .sec-head .lbl{ color:#5b639a; font-weight:700; }
  .page-nav-sel{ border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:15px;
        font-weight:800; color:var(--text); background:var(--card); }
  .mini{ border:none; border-radius:10px; padding:8px 14px; font-weight:700; font-size:14px; }
  .mini.add{ background:#86efac; color:#14532d; } .mini.rm{ background:#fcd34d; color:#713f12; }
  .emp{ background:var(--card); border:1px solid var(--line); border-radius:14px;
        padding:8px; margin-bottom:8px; display:flex; align-items:stretch; gap:6px;
        box-shadow:0 1px 3px rgba(20,30,80,.05); }
  .name{ flex:0 0 120px; display:flex; align-items:center; justify-content:center;
        font-weight:700; font-size:16px; padding:6px 4px; border-radius:10px; text-align:center;
        touch-action:none; user-select:none; -webkit-user-select:none; }
  .name.act{ background:var(--accent); color:#fff; }
  .emp.dragging{ opacity:.9; transform:scale(1.02); box-shadow:0 8px 24px rgba(20,30,80,.25); position:relative; z-index:5; }
  .emp.drag-target{ box-shadow:inset 0 0 0 2px var(--accent); }
  .btn{ border:1px solid rgba(0,0,0,.12); border-radius:11px; padding:12px 2px;
        font-weight:800; font-size:13px; color:#fff; }
  .b-in{ flex:1.3; background:#22c55e; } .b-in.on{ background:#15803d; box-shadow:inset 0 0 0 2px #064e2b; }
  .b-out{ flex:0.8; background:#ec4899; } .b-out.on{ background:#be185d; box-shadow:inset 0 0 0 2px #831843; }
  .b-e{ flex:0.8; background:#3b82f6; } .b-e.has{ background:#1d4ed8; box-shadow:inset 0 0 0 2px #1e3a8a; }
  .b-o{ flex:0.8; background:#f59e0b; color:#3a2a00; } .b-o.has{ background:#b45309; color:#fff; }
  .badge{ font-size:11px; font-weight:700; display:block; }
  .log{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:6px 12px; }
  .logrow{ display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px solid var(--line); }
  .logrow:last-child{ border-bottom:none; }
  .tag{ font-size:12px; font-weight:700; padding:3px 10px; border-radius:20px; }
  .t-in{ background:#dcfce7; color:#15803d; } .t-out{ background:#fce7f3; color:#db2777; }
  .t-e{ background:#dbeafe; color:#1d4ed8; } .t-o{ background:#fef3c7; color:#b45309; }
  .logrow .nm{ font-weight:700; flex:1; } .logrow .tm{ color:var(--muted); font-size:13px; }
  .logrow .x{ border:none; background:none; color:var(--muted); font-size:16px; }
  textarea{ width:100%; border:1px solid var(--line); border-radius:12px; padding:12px; font-size:15px; min-height:54px; }
  .send{ width:100%; border:none; border-radius:14px; padding:18px; font-size:18px; font-weight:800; color:#fff; margin-top:10px; }
  .send.csv{ background:var(--accent); } .send.one{ background:var(--send); }
  .hint{ text-align:center; color:#7c84ad; font-size:12px; margin-top:8px; }
  .clr{ border:none; background:none; color:var(--danger); font-weight:700; }
  /* 週間チェック */
  .week{ background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .wrow{ display:flex; align-items:center; gap:12px; padding:13px 14px; border-bottom:1px solid var(--line); }
  .wrow:last-child{ border-bottom:none; }
  .wrow.today{ background:#eef4ff; }
  .wrow .wd{ flex:1; font-weight:700; font-size:15px; }
  .wrow .wsub{ color:var(--muted); font-size:12px; font-weight:400; margin-left:6px; }
  .stat{ font-weight:800; font-size:15px; padding:6px 14px; border-radius:20px; min-width:92px; text-align:center; }
  .stat.ok{ background:#dcfce7; color:#15803d; } .stat.no{ background:#fee2e2; color:#b91c1c; }
  .wrow .wdel{ border:none; background:none; color:var(--muted); font-size:17px; padding:4px 6px; margin-left:4px; }
  .wrow .sentbadge{ font-size:12px; font-weight:800; color:#1d4ed8; background:#dbeafe; padding:5px 10px; border-radius:20px; white-space:nowrap; }
  /* 画面内モーダル（prompt/confirm代替） */
  .modal-bg{ position:fixed; inset:0; background:rgba(15,18,38,.55); display:none;
        align-items:center; justify-content:center; z-index:999; padding:24px; }
  .modal{ background:#fff; border-radius:16px; padding:20px; width:100%; max-width:340px;
        box-shadow:0 12px 40px rgba(0,0,0,.3); }
  .modal .m-msg{ font-size:16px; font-weight:700; margin-bottom:14px; line-height:1.5; }
  .modal input{ width:100%; font-size:18px; padding:12px; border:1px solid var(--line);
        border-radius:10px; margin-bottom:14px; }
  .m-btns{ display:flex; gap:10px; }
  .m-btns button{ flex:1; border:none; border-radius:10px; padding:13px; font-size:16px; font-weight:800; }
  .m-btns .m-ok{ background:var(--accent); color:#fff; } .m-btns .m-cancel{ background:#e2e8f0; color:#334155; }
  .name.del{ background:#fee2e2; color:#b91c1c; }
  .btn-detail{ border:none; border-radius:8px; background:#e0e7ff; color:#3730a3; font-size:13px; font-weight:800; padding:6px 8px; cursor:pointer; flex-shrink:0; }
  .cat-sel{ flex:0 0 44px; border:1px solid var(--line); border-radius:8px; background:var(--card);
        color:var(--text); font-size:13px; font-weight:800; text-align:center; padding:2px; }

  /* ── 個人別出勤簿ページ ── */
  #page-personal{ display:none; padding:14px 14px 96px; }
  #page-personal.active{ display:block; }
  .pb-head{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .pb-back{ background:var(--accent); color:#fff; border:none; border-radius:10px; padding:10px 16px; font-size:15px; font-weight:800; cursor:pointer; }
  .pb-title{ font-size:20px; font-weight:800; }
  .pb-controls{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }

<script>
const EK="kinmu_emps_v1", LK="kinmu_logs_v1", MK="kinmu_memo_v1", WKEY="kinmu_workdate_v1", PWR="kinmu_power_v1", SK="kinmu_sent_v1";
const $=id=>document.getElementById(id);
const DEF=["宗徳","みき子","絹次","大輝","浩太","久美子","萩原 千恵","花田 理恵","木場 雅子","天田 仁美","ともちゃん","まきちゃん","土井さん","工藤君","かべちゃん","のりちゃん","その他"];
const WD="日月火水木金土";
const EMPCAT_KEY="kinmu_empcat_v1";
const SENJU_DEFAULT=["宗徳","みき子","絹次"];
const empCat=(name)=>{
  const saved=load(EMPCAT_KEY,{})[name];
  if(saved) return saved;
  return SENJU_DEFAULT.includes(name) ? "senju" : "kyuyo";
};
let removeMode=false;

// ── 日本の祝日判定（簡易版。振替休日対応） ──
function nthMonday(y,m,n){ // その月のn番目の月曜日
  const d=new Date(y,m-1,1);
  let cnt=0;
  while(true){
    if(d.getDay()===1){ cnt++; if(cnt===n) return d.getDate(); }
    d.setDate(d.getDate()+1);
  }
}
function shunbun(y){ return Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4)); }
function shuubun(y){ return Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4)); }
function holidaySet(y){
  const s=new Set();
  const add=(m,d)=>s.add(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  add(1,1);                          // 元日
  add(1,nthMonday(y,1,2));           // 成人の日
  add(2,11);                         // 建国記念の日
  add(2,23);                         // 天皇誕生日
  add(3,shunbun(y));                 // 春分の日
  add(4,29);                         // 昭和の日
  add(5,3); add(5,4); add(5,5);      // 憲法記念日・みどりの日・こどもの日
  add(7,nthMonday(y,7,3));           // 海の日
  add(8,11);                         // 山の日
  add(9,nthMonday(y,9,3));           // 敬老の日
  add(9,shuubun(y));                 // 秋分の日
  add(10,nthMonday(y,10,2));         // スポーツの日
  add(11,3);                         // 文化の日
  add(11,23);                        // 勤労感謝の日
  // 振替休日：祝日が日曜なら翌日以降の最初の平日を追加
  [...s].forEach(ds=>{
    const d=new Date(ds+'T00:00');
    if(d.getDay()===0){
      let nd=new Date(d); nd.setDate(nd.getDate()+1);
      while(s.has(ymd(nd))) nd.setDate(nd.getDate()+1);
      s.add(ymd(nd));
    }
  });
  return s;
}
const _holidayCache={};
function isHoliday(dateStr){
  const y=parseInt(dateStr.slice(0,4));
  if(!_holidayCache[y]) _holidayCache[y]=holidaySet(y);
  return _holidayCache[y].has(dateStr);
}

const load=(k,d)=>{ try{return JSON.parse(localStorage.getItem(k))??d;}catch(e){return d;} };
const set=(k,v)=>{ localStorage.setItem(k,JSON.stringify(v)); syncPush(k,v); };

// ── 全端末同期（Cloudflare Worker経由） ──
const SYNC_URL="https://kintai-sync.manasarowaru.workers.dev";
const SYNC_KEY="kintai2026sync";
const SYNC_KEYS=["kinmu_emps_v1","kinmu_logs_v1","kinmu_memo_v1","kinmu_power_v1","kinmu_sent_v1",
  "kinmu_rates_v1","kinmu_rates_senju_v1","kinmu_rates_other_v1","kinmu_empcat_v1"];
function syncPush(k,v){
  if(!SYNC_KEYS.includes(k)) return;
  fetch(`${SYNC_URL}/set?k=${k}`,{
    method:"POST",
    headers:{"Content-Type":"application/json","X-Upload-Key":SYNC_KEY},
    body:JSON.stringify(v),
  }).catch(()=>{}); // オフライン時は無視（次回のpullで整合）
}
async function syncPullAll(){
  try{
    const res=await fetch(`${SYNC_URL}/getall`,{cache:"no-store"});
    if(!res.ok) return false;
    const data=await res.json();
    SYNC_KEYS.forEach(k=>{
      if(data[k]!=null) localStorage.setItem(k,JSON.stringify(data[k]));
    });
    return true;
  }catch(e){ return false; }
}
function forcePushAll(ev){
  クリック作動(ev && ev.currentTarget);
  uiConfirm("このデバイスの今のデータを、クラウド経由で他の端末にも反映します。よろしいですか？", async ()=>{
    SYNC_KEYS.forEach(k=>{
      const raw=localStorage.getItem(k);
      const v=raw!=null?JSON.parse(raw):null;
      syncPush(k,v);
    });
    speak("送信しました");
    renderCurrentPage();
  });
}
function forcePullAll(ev){
  クリック作動(ev && ev.currentTarget);
  syncPullAll().then(ok=>{
    if(ok){ renderCurrentPage(); }
    else uiAlert("取得できませんでした。通信状況を確認してください");
  });
}
const emps=()=>load(EK,DEF);
const logs=()=>load(LK,[]);
const pad=n=>String(n).padStart(2,"0");
const ymd=dt=>`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
const today=()=>ymd(new Date());
const addDays=(s,n)=>{ const d=new Date(s+"T00:00"); d.setDate(d.getDate()+n); return ymd(d); };
const fmtD=s=>{ const[y,m,d]=s.split("-"); return `${parseInt(m)}/${parseInt(d)}`; };
const wdOf=s=>WD[new Date(s+"T00:00").getDay()];
const dayHasPunch=s=>logs().some(x=>x.date===s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const qcsv=s=>{ s=String(s==null?"":s); return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
// カンマ区切り数値入力（金額欄）
const fmtNum=v=>{ if(v===null||v===undefined||v==="") return ""; const n=parseFloat(String(v).replace(/,/g,"")); return isNaN(n)?"":n.toLocaleString('en-US',{maximumFractionDigits:2}); };
const parseNum=s=>{ if(s==null) return null; const t=String(s).trim().replace(/,/g,""); if(t==="") return null; const n=parseFloat(t); return isNaN(n)?null:n; };

// ── 画面内モーダル（prompt/confirm/alert 代替。artifactでも動く） ──
function closeModal(){ $("modal").style.display="none"; $("m-input").style.display="none"; $("m-btns").innerHTML=""; }
function uiAlert(msg, cb){
  $("m-msg").textContent=msg; $("m-input").style.display="none";
  $("m-btns").innerHTML='<button class="m-ok">OK</button>'; $("modal").style.display="flex";
  $("m-btns").querySelector(".m-ok").onclick=()=>{ closeModal(); cb&&cb(); };
}
function uiConfirm(msg, onYes){
  $("m-msg").textContent=msg; $("m-input").style.display="none";
  $("m-btns").innerHTML='<button class="m-cancel">いいえ</button><button class="m-ok">はい</button>';
  $("modal").style.display="flex";
  $("m-btns").querySelector(".m-ok").onclick=()=>{ closeModal(); onYes&&onYes(); };
  $("m-btns").querySelector(".m-cancel").onclick=closeModal;
}
function uiPrompt(msg, def, onOk, isNum){
  $("m-msg").textContent=msg;
  const inp=$("m-input"); inp.style.display="block"; inp.value=def||""; inp.type=isNum?"number":"text";
  $("m-btns").innerHTML='<button class="m-cancel">キャンセル</button><button class="m-ok">OK</button>';
  $("modal").style.display="flex"; setTimeout(()=>{ try{inp.focus();}catch(e){} },50);
  $("m-btns").querySelector(".m-ok").onclick=()=>{ const v=inp.value; closeModal(); onOk&&onOk(v); };
  $("m-btns").querySelector(".m-cancel").onclick=closeModal;
}

// ── 作業日（workDate）ロジック ──
// 日が変わっても、その日を打ってなければ日付は進まない＝そのまま。
// 打ったら次の日（＝最終的に当日）へ進む。
function workDate(){
  let w=load(WKEY,null);
  if(!w){ w=today(); set(WKEY,w); }
  if(w>today()){ w=today(); set(WKEY,w); }  // 未来日は当日に丸める
  return w;
}
function setWork(w){ set(WKEY,w); $("wd").value=w; }
function manualDate(){ setWork($("wd").value); render(); }

function punch(name,type,hours){
  const n=new Date(); const time=`${pad(n.getHours())}:${pad(n.getMinutes())}`;
  const w=workDate();
  const arr=logs();
  // 同じ日付・同じ氏名・同じ種別が既にあれば上書き（重複させない）
  const i=arr.findIndex(x=>x.date===w && x.name===name && x.type===type);
  const rec={date:w,time,name,type,hours:hours||"",ts:Date.now()};  // ts=押した順（点灯判定用）
  if(i>=0) arr[i]=rec; else arr.unshift(rec);
  set(LK,arr);
  clearSent(w);   // この日を編集したので「送信済」を解除（再送が必要）
  render();  // 自動では進まない。確定ボタンで次の日へ。
}
function speak(msg){ try{ const u=new SpeechSynthesisUtterance(msg); u.lang="ja-JP"; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }
function confirmDay(ev){
  const w=workDate();
  const go=()=>{ if(dayHasPunch(w)) markSent(w); if(w<today()) setWork(addDays(w,1)); render(); };
  クリック作動(ev && ev.currentTarget);
  if(!dayHasPunch(w)) uiConfirm(`${fmtD(w)} は打刻がありません。それでも確定しますか？`, go);
  else go();
}
function クリック作動(el){
  // クリック音（ピッ）+ ボタンを0.5秒だけ薄くして元に戻す
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator(), gain=ctx.createGain();
    osc.type="sine"; osc.frequency.value=880;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.15);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+0.15);
  }catch(e){}
  if(el){
    const orig=el.style.opacity;
    el.style.transition="opacity .15s";
    el.style.opacity="0.4";
    setTimeout(()=>{ el.style.opacity=orig||""; }, 500);
  }
}
function sendDay(ev){
  exportCSV(true);
  クリック作動(ev && ev.currentTarget);
}
function askHours(name,type){
  uiPrompt(`${name} の${type}時間（h）`, "1", (h)=>{
    const v=parseFloat(h); if(isNaN(v)||v<=0){ uiAlert("数値を入れてください"); return; }
    punch(name,type,v);
  }, true);
}
function lastInOut(name){
  const w=workDate();
  const cand=logs().filter(x=>x.date===w && x.name===name && (x.type==="出勤"||x.type==="早退"));
  if(!cand.length) return null;
  // 押した順(ts)で最後を採用。tsが無い旧データは時刻で補助。
  cand.sort((a,b)=>((a.ts||0)-(b.ts||0)) || (a.time||"").localeCompare(b.time||""));

// ── 氏名の板：長押しドラッグで並び替え／素早いタップは従来の打刻 ──
let drag=null;
function nameDown(e,i){
  if(e.button!=null && e.button!==0) return;        // 左ボタン/タッチのみ
  const nameEl=e.currentTarget, emp=nameEl.closest('.emp');
  drag={ i, nameEl, emp, pid:e.pointerId, startX:e.clientX, startY:e.clientY,
         active:false, dead:false, longTimer:null, rows:null };
  try{ nameEl.setPointerCapture(e.pointerId); }catch(_){}
  drag.longTimer=setTimeout(startDrag,300);          // 300ms長押しでドラッグ開始
  nameEl.addEventListener('pointermove',onMove);
  nameEl.addEventListener('pointerup',onUp);
  nameEl.addEventListener('pointercancel',onUp);
}
function startDrag(){
  if(!drag||drag.dead||removeMode) return;           // 削除モード中はドラッグしない
  drag.active=true;
  drag.emp.classList.add('dragging');
  drag.rows=[...document.querySelectorAll('#emps .emp')].map(el=>{
    const r=el.getBoundingClientRect();
    return {el, mid:r.top+r.height/2, top:r.top, bottom:r.bottom, idx:+el.dataset.emp};
  });
}
function onMove(e){
  if(!drag||drag.dead) return;
  const dx=e.clientX-drag.startX, dy=e.clientY-drag.startY;
  if(!drag.active){                                  // まだ長押し成立前
    if(Math.abs(dx)>10||Math.abs(dy)>10){ clearTimeout(drag.longTimer); drag.dead=true; }
    return;
  }
  e.preventDefault();
  drag.emp.style.transform=`translateY(${dy}px) scale(1.02)`;
  const y=e.clientY;
  drag.rows.forEach(r=>r.el.classList.toggle('drag-target',
        r.idx!==drag.i && y>=r.top && y<=r.bottom));
}
function computeTarget(d,y){                          // ドラッグ対象を除いた挿入位置
  let idx=0;
  for(const r of d.rows){ if(r.idx===d.i) continue; if(r.mid<y) idx++; }
  return idx;
}
function onUp(e){
  if(!drag) return;
  clearTimeout(drag.longTimer);
  const nameEl=drag.nameEl;
  nameEl.removeEventListener('pointermove',onMove);
  nameEl.removeEventListener('pointerup',onUp);
  nameEl.removeEventListener('pointercancel',onUp);
  try{ nameEl.releasePointerCapture(drag.pid); }catch(_){}
  const d=drag; drag=null;
  if(d.active){
    const target=computeTarget(d,e.clientY);
    d.emp.classList.remove('dragging'); d.emp.style.transform='';
    moveEmp(d.i,target); render();
  }else if(!d.dead){
    nameTap(d.i);                                    // 素早いタップ＝従来の打刻/削除
  }
}

function renderPersonal(){
  const name=document.getElementById('pb-name').value;
  const ym=document.getElementById('pb-month').value;
  if(!name||!ym) return;
  const [y,m]=ym.split('-').map(Number);
  const days=new Date(y,m,0).getDate();
  const myLogs=logs().filter(x=>x.name===name && x.date && x.date.startsWith(ym));
  const byDate={};
  myLogs.forEach(x=>{ (byDate[x.date]=byDate[x.date]||[]).push(x); });
  const isKyuyo=empCat(name)==='kyuyo';
  const kRate=isKyuyo?(ratesOf('kyuyo')[name]||{}):null;

  let rows='', shukin=0, soutai=0, hayade=0, zangyou=0;
  for(let d=1;d<=days;d++){
    const date=`${ym}-${String(d).padStart(2,'0')}`;
    const wd=new Date(date+'T00:00').getDay();
    const wdStr='日月火水木金土'[wd];
    const isHol=isHoliday(date);
    const dayCls = isHol ? 'holiday' : (wd===6 ? 'saturday' : (wd===0 ? 'sunday' : ''));
    const recs=byDate[date]||[];
    const hasIn=recs.some(r=>r.type==='出勤');
    const hasOut=recs.some(r=>r.type==='早退');
    const eRec=recs.find(r=>r.type==='早出');
    const oRec=recs.find(r=>r.type==='残業');
    if(hasIn) shukin++;
    if(hasOut) soutai++;
    if(eRec) hayade+=parseFloat(eRec.hours)||0;
    if(oRec) zangyou+=parseFloat(oRec.hours)||0;
    let amtTxt='';
    if(isKyuyo && (hasIn||hasOut||eRec||oRec)){
      const isWknd = isHol || wd===6 || wd===0;
      let amt=0;
      if(hasIn) amt += Number((isWknd?kRate.doniti:kRate.heijitsu))||0;
      if(hasOut) amt -= Number(kRate.sotai)||0;
      if(eRec) amt += (parseFloat(eRec.hours)||0) * (Number(kRate.hayade)||0);
      if(oRec) amt += (parseFloat(oRec.hours)||0) * (Number(kRate.hayade)||0);
      amtTxt = fmtNum(amt);
    }
    rows+=`<tr class="${dayCls} ${date===pbSelDate?'sel':''}" onclick="pbSelectDay('${date}')">
      <td>${m}/${d}</td>
      <td>${wdStr}</td>
      <td class="tag-in">${hasIn?'○':''}</td>
      <td class="tag-out">${hasOut?'早退':''}</td>
      <td class="tag-e">${eRec?(eRec.hours+'h'):''}</td>
      <td class="tag-o">${oRec?(oRec.hours+'h'):''}</td>
      <td class="tag-amt">${amtTxt}</td>
    </tr>`;
  }
  document.getElementById('pb-body').innerHTML=rows;
  pbRefreshInput();
  document.getElementById('pb-summary').innerHTML=`
    <h3>${name} — ${m}月 集計</h3>
    <div class="pb-sum-row"><span>出勤日数</span><span>${shukin}日</span></div>
    <div class="pb-sum-row"><span>早退</span><span>${soutai}回</span></div>
    <div class="pb-sum-row"><span>早出</span><span>${hayade}h</span></div>
    <div class="pb-sum-row"><span>残業</span><span>${zangyou}h</span></div>
  `;
}

const RATETAB_KEY="kinmu_ratetab_v1";
let rateTab=load(RATETAB_KEY,"kyuyo");
const ratesOf=(cat)=>load(RATE_CATS[cat].key,{});
function setRateTab(cat){
  rateTab=cat;
  localStorage.setItem(RATETAB_KEY,JSON.stringify(cat));
  renderRates();
}
let bulkRatesOpen=false;
function toggleBulkRates(){
  bulkRatesOpen=!bulkRatesOpen;
  const btn=document.getElementById('bulk-toggle-btn');
  if(btn) btn.textContent = bulkRatesOpen ? '一括変更 ✕' : '一括変更';
  document.getElementById('rate-bulk').style.display = bulkRatesOpen ? '' : 'none';
}
function showRates(){
  document.getElementById('page-main').style.display='none';
  document.getElementById('page-personal').classList.remove('active');
  document.getElementById('page-rates').classList.add('active');
  syncPageNavSel('rates');
  renderRates();
  syncPullAll().then(ok=>{ if(ok) renderRates(); });
}
function renderRates(){
  const cfg=RATE_CATS[rateTab];
  document.getElementById('rate-tab-sel').value=rateTab;
  const gridCls = 'rate-grid bulk-row';

  // 一括入力カード（ここに数字を入れて「変更」を押すと全員に反映）
  const bulkFields=cfg.fields.map(([k,label])=>`
    <div class="rate-field">
      <label>${label}</label>
      <input type="text" inputmode="decimal" id="bulk-${k}" placeholder="" onblur="this.value=fmtNum(this.value)">
    </div>`).join("");
  const bulkEl=document.getElementById('rate-bulk');
  bulkEl.innerHTML = `
    <div class="rc-name">🔁 一括変更（同区分の全員に反映）</div>
    <div class="rate-grid bulk-row">${bulkFields}</div>
    <button class="rate-export" style="margin-top:8px;" onclick="applyBulkRates()">この内容で変更 ▶</button>
  `;
  bulkEl.style.display = bulkRatesOpen ? '' : 'none';
  const toggleBtn=document.getElementById('bulk-toggle-btn');
  if(toggleBtn) toggleBtn.textContent = bulkRatesOpen ? '一括変更 ✕' : '一括変更';

  const all=ratesOf(rateTab);
  const targetEmps = emps().filter(name=>empCat(name)===rateTab);
  const isSenju = rateTab==='senju';
  document.getElementById('rates-list').innerHTML = (targetEmps.length?targetEmps:['(この区分の従業員はいません)']).map((name,idx)=>{
    if(name==='(この区分の従業員はいません)') return `<div class="rate-card" style="text-align:center;color:#8a93b8;">${name}</div>`;
    const r=all[name]||{};
    const nameEsc=esc(name).replace(/'/g,"\\'");
    const fields=cfg.fields.map(([k,label])=>`
      <div class="rate-field">
        <label>${label}</label>
        <input type="text" inputmode="decimal" id="r-${idx}-${k}" value="${r[k]!=null?fmtNum(r[k]):''}"
          onblur="this.value=fmtNum(this.value)"
          ${isSenju?`onkeydown="if(event.key==='Enter'){event.preventDefault();setRate('${nameEsc}','${k}',this.value);this.blur();}"`:''}>
      </div>`).join("");
    return `<div class="rate-card">
      <div class="rc-name-row">
        <div class="rc-name">${esc(name)}</div>
        ${isSenju?'':`<button class="rc-confirm-btn" onclick="applyRateForEmp('${nameEsc}',${idx})">決定</button>`}
      </div>
      <div class="${gridCls}">${fields}</div>
    </div>`;
  }).join("");
}
function applyRateForEmp(name,idx){
  const cfg=RATE_CATS[rateTab];
  const all=ratesOf(rateTab);
  if(!all[name]) all[name]={};
  cfg.fields.forEach(([k])=>{
    const el=document.getElementById(`r-${idx}-${k}`);
    if(el) all[name][k] = parseNum(el.value);
  });
  set(RATE_CATS[rateTab].key,all);
  renderRates();
}
function applyBulkRates(){
  const cfg=RATE_CATS[rateTab];
  const targetEmps = emps().filter(name=>empCat(name)===rateTab);
  if(!targetEmps.length){ uiAlert("この区分の従業員がいません"); return; }
  const vals={};
  cfg.fields.forEach(([k])=>{
    const el=document.getElementById(`bulk-${k}`);
    if(el && el.value!=="") vals[k]=parseNum(el.value);
  });
  if(Object.keys(vals).length===0){ uiAlert("数字を入力してください"); return; }
  uiConfirm(`${cfg.label}の${targetEmps.length}名全員に同じ金額を反映しますか？`, ()=>{
    const all=ratesOf(rateTab);
    targetEmps.forEach(name=>{
      if(!all[name]) all[name]={};
      Object.entries(vals).forEach(([k,v])=>{ all[name][k]=v; });
    });
    set(RATE_CATS[rateTab].key,all);
    renderRates();
  });
}
function setRate(name,key,value){
  const all=ratesOf(rateTab);
  if(!all[name]) all[name]={};
  all[name][key] = parseNum(value);
  set(RATE_CATS[rateTab].key,all);
}
function exportRatesCSV(){
  const cfg=RATE_CATS[rateTab];
  const all=ratesOf(rateTab);
  let csv="氏名,"+cfg.fields.map(([,label])=>label).join(",")+"\n";
  emps().filter(name=>empCat(name)===rateTab).forEach(name=>{
    const r=all[name]||{};
    const row=[name,...cfg.fields.map(([k])=>r[k]!=null?r[k]:"")];
    csv+=row.map(qcsv).join(",")+"\n";
  });
  const bom="﻿";
  const blob=new Blob([bom+csv],{type:"text/csv;charset=utf-8"});
  const fname=`${cfg.fname}_${today().replace(/-/g,"")}.csv`;
  const file=new File([blob],fname,{type:"text/csv"});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:fname}).catch(()=>{});
  }else{
    const url=URL.createObjectURL(blob); const a=document.createElement("a");
    a.href=url; a.download=fname; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
}
</script>
</body>
</html>
